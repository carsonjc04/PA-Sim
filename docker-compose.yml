services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinicsim
      POSTGRES_PASSWORD: clinicsim
      POSTGRES_DB: clinicsim
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - clinicsim-pg:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicsim"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  clinicsim-pg:
